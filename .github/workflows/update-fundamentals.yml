name: update-fundamentals
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
  push:
    paths: [scripts/update_fundamentals.py]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_fundamentals.py
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add data/fundamentals.json
          git commit -m "chore: 更新基本面数据" || true
          git push
