name: update-fundamentals
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # 铁律：watchlist 变了（新增/删除标的）必须立刻补基本面，否则新标的的市值浮窗是空的——
    # 行情走 update-data，基本面走本管线，两条管线各自独立，谁也不会替谁跑。
    paths:
      - "scripts/update_fundamentals.py"
      - "config/watchlist.json"
permissions:
  contents: write
concurrency:
  group: update-fundamentals
  cancel-in-progress: false
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_fundamentals.py
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add data/fundamentals.json
          git commit -m "chore: 更新基本面数据" || true
          git push
