name: probe-em-spot
on:
  push:
    paths: [".github/workflows/probe-em.yml"]
permissions:
  contents: write
concurrency:
  group: probe-em
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'EOF'
          import urllib.request, json, time
          out={}
          def get(url,hdr):
              err=""
              for i in range(3):
                  try:
                      req=urllib.request.Request(url,headers=hdr)
                      return urllib.request.urlopen(req,timeout=20).read().decode("utf-8","ignore")
                  except Exception as e:
                      err=str(e)[:120]; time.sleep(2)
              return "ERR:"+err
          for sid in ["1.601126","1.600312","0.000400","1.688676","177.103590","178.103590","177.033100","178.033100","106.HUBB","105.HUBB","106.POWL","105.POWL"]:
              url=("https://push2his.eastmoney.com/api/qt/stock/kline/get?secid="+sid+
                   "&klt=101&fqt=1&fields1=f1,f2,f3&fields2=f51,f53&beg=20260720&end=20500101&lmt=100")
              t=get(url,{"User-Agent":"Mozilla/5.0","Referer":"https://quote.eastmoney.com/"})
              try:
                  d=json.loads(t)
                  k=(d.get("data") or {}).get("klines") or []
                  out[sid]={"name":(d.get("data") or {}).get("name"),"last2":k[-2:]}
              except Exception:
                  out[sid]={"raw":t[:100]}
          open("data/probe_em.json","w").write(json.dumps(out,ensure_ascii=False,indent=1))
          EOF
      - name: commit
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add data/probe_em.json
          git commit -m "probe: 变压器8标的收盘价" || exit 0
          git pull --rebase origin main
          git push
