name: probe-fund
on:
  push:
    paths: [scripts/probe_fund.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_fund.py
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add data/probe_fund.json
          git commit -m "chore: probe fundamentals result" || true
          git push
